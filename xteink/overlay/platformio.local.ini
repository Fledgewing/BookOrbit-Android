; CrossInk-Tailnet overlay. scripts/apply.sh copies this file into a
; CrossInk-Bookorbit checkout as platformio.local.ini, which upstream loads
; through `extra_configs` (and git-ignores). It only appends the overlay's
; pre-script to each reader env; everything else lives in tailnet/.
;
; ${base.extra_scripts} keeps upstream's own scripts. An env that defines its
; own extra_scripts upstream would need listing here instead; none does today
; (scripts/apply.sh checks).

[env:x4-pro]
extra_scripts = pre:tailnet/tailnet_build.py
  ${base.extra_scripts}

[env:x4-classic]
extra_scripts = pre:tailnet/tailnet_build.py
  ${base.extra_scripts}

; X3/X4 (ESP32-C3): its image had ~9 KB to spare before Tailscale. Building
; only English UI strings frees the room (upstream's own knob, see
; [crossink] in platformio.ini). Add codes, e.g. "en,de", if you need them and
; they fit; the partition table is never changed (USB-only, one-way).
[env:default]
custom_i18n_builtin_langs = en
extra_scripts = pre:tailnet/tailnet_build.py
  ${base.extra_scripts}

; Upstream's SDL simulator, one per reader (xteink/test/e2e/): the same pre-script sets the reader's
; switches and builds tailnet/sim in place of Tailscale. ${simulator-base.extra_scripts} keeps
; upstream's simulator scripts, the runner included.
[env:x4-pro-simulator]
extra_scripts = pre:tailnet/tailnet_build.py
  ${simulator-base.extra_scripts}

[env:x4-classic-simulator]
extra_scripts = pre:tailnet/tailnet_build.py
  ${simulator-base.extra_scripts}

[env:simulator-X3]
custom_i18n_builtin_langs = en
extra_scripts = pre:tailnet/tailnet_build.py
  ${simulator-base.extra_scripts}
