<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookSync Home Prototype</title>
<style>
/* ---------- prototype shell (not part of the device design) ---------- */
:root{--shell:#e7e6e3;--shell-ink:#1d1d1d;--shell-mute:#5d5d5a;--shell-line:#cfcdc8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--shell);color:var(--shell-ink);font-family:var(--sans)}
.shell{display:flex;gap:28px;padding:18px 24px 28px;align-items:flex-start;min-height:100vh}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;flex:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--shell-ink);border-radius:10px;overflow:hidden}
.seg button{font:600 13px var(--sans);border:0;background:#fff;padding:8px 12px;cursor:pointer;color:var(--shell-ink)}
.seg button+button{border-left:1.5px solid var(--shell-ink)}
.seg button[aria-pressed=true]{background:var(--shell-ink);color:#fff}
.sbtn{font:600 13px var(--sans);border:1.5px solid var(--shell-ink);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
.tog{display:inline-flex;gap:7px;align-items:center;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.tog input{width:16px;height:16px;accent-color:#1d1d1d}
.frame{background:#262626;border-radius:34px;padding:26px 22px 30px;box-shadow:0 1px 0 #fff inset,0 18px 40px rgba(0,0,0,.18)}
.frame.x4{border-radius:30px;padding:22px 18px 24px}
.scalebox{position:relative}
.hwkeys{display:flex;gap:8px;align-items:center}
.hwkeys button{font:700 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;background:#2e2e2e;color:#f2f2f2;border:0;border-radius:9px;padding:11px 14px;min-width:64px;cursor:pointer;box-shadow:0 2px 0 #000}
.hwkeys button:active{transform:translateY(1px);box-shadow:none}
.hwkeys .hint{font-size:12px;color:var(--shell-mute);margin-left:6px}
.side{max-width:400px;min-width:300px;flex:1;background:#fbfaf8;border:1px solid var(--shell-line);border-radius:14px;padding:20px 22px;position:sticky;top:18px}
.side h1{font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--shell-mute);margin:0 0 6px}
.side h2{font:600 22px/1.2 var(--serif);margin:0 0 10px}
.side p{font-size:14.5px;line-height:1.5;margin:0 0 10px}
.side ul{margin:6px 0 12px;padding-left:18px;font-size:14px;line-height:1.5}
.side .foot{font-size:12px;color:var(--shell-mute);border-top:1px solid var(--shell-line);padding-top:10px;margin-top:14px;line-height:1.45}
.side kbd{font:600 11px var(--sans);border:1px solid #bbb;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}

/* ---------- the device screen: grayscale e-ink only ---------- */
.screen{position:relative;overflow:hidden;background:#fff;color:#000;font-family:var(--sans);
  --g1:#555;--g2:#8c8c8c;--g3:#cfcfcf;--g4:#ececec;
  -webkit-font-smoothing:antialiased;user-select:none;line-height:1.25}
.screen.m8c{--fc:12px;--fs:14px;--fb:16px;--fm:19px;--ft:25px;--fh:31px;--fn:40px;--pad:16px;--r:16px;--rs:10px;--tap:52px;--edge:1px;--im:#cfcfcf;--im2:#8c8c8c}
.screen.x4{--fc:12px;--fs:14px;--fb:16px;--fm:18px;--ft:21px;--fh:24px;--fn:30px;--pad:12px;--r:13px;--rs:9px;--tap:40px;--edge:1px;--im:#fff;--im2:#fff}
/* X4 render profile: black, white and two grays only; meta text is black at a lighter weight, never gray */
.screen.x4{--tap:50px}
.screen.x4{--g1:#000;--g2:#808080;--g3:#c0c0c0;--g4:#fff}
.screen.x4 .mute,.screen.x4 .meta,.screen.x4 .sub{font-weight:400}
.screen.x4 .scrim{background:transparent}
.screen.x4 .panel,.screen.x4 .sheet,.screen.x4 .card{box-shadow:0 0 0 6px #fff}
.screen.x4 .tile{border-color:#000}
.screen.x4 .well{border:1.5px solid #000}
.screen button{font-family:inherit;color:inherit}
.view{position:absolute;inset:0}
.layer{position:absolute;inset:0}
.ser{font-family:var(--serif)}
.mute{color:var(--g1)}
.num{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font-size:var(--fc);font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-act]{cursor:pointer}
.ic{display:block;flex:none}

/* focus for X4 button navigation */
.screen.kbd .kf{outline:3px solid #000;outline-offset:2px;box-shadow:0 0 0 2px #fff,0 0 0 7px #000 !important;position:relative;z-index:3}
.screen.kbd .hdr .kf{outline-offset:-3px;box-shadow:none !important}
.screen.kbd .hdr .kf.inkbg{outline-color:#000}
.screen.kbd .hs{margin:0 -6px !important;min-height:0 !important;padding:3px 6px !important;border-radius:6px}
.screen.kbd .kf.inkbg{outline-color:#fff;box-shadow:0 0 0 2px #000,0 0 0 7px #fff !important}
/* Focus on dark things (round 3, maintainer bug): one rule, "the focused thing turns white".
   kf-dark: a black control on white (black pill, toolbar check, You're-here row, toast action) inverts to white with black
     content and a 3 px black outer ring behind a 2 px white gap.
   kf-onink: a control inside the black hero (Resume, the hero menu, the cover) turns white with black content, then a 4 px
     black gap and a 5 px white ring, so it stands out from the black around it.

   kf-tile: a whole-tile target draws its ring inside its own edge (never in the gutter); on the black hero the whole tile inverts.
   Pure black and white only, so it holds on the X4 profile. */
.screen.kbd .kf.kf-dark{background:#fff !important;color:#000 !important;border-color:#000 !important;outline:none !important;box-shadow:0 0 0 2px #fff,0 0 0 5px #000 !important}
.screen.kbd .kf.kf-dark *{color:#000 !important;border-color:#000 !important}
.screen.kbd .kf.kf-onink{background:#fff !important;color:#000 !important;border-color:#fff !important;outline:none !important;box-shadow:0 0 0 4px #000,0 0 0 9px #fff !important}
.screen.kbd .kf.kf-onink *{color:#000 !important}
.screen.kbd .kf.kf-tile{outline:none !important;box-shadow:inset 0 0 0 4px #000,inset 0 0 0 7px #fff !important;border-radius:var(--r)}
.screen.kbd .edcover.kf.kf-tile{position:absolute;box-shadow:
inset 0 0 0 4px #000,inset 0 0 0 9px #fff !important}
.screen.kbd .tile.ink .tin.kf.kf-tile{background:#000;filter:invert(1);box-shadow:
inset 0 0 0 4px #fff,inset 0 0 0 7px #000 !important}
.screen.kbd .tile.ink .kf.kf-tile .cov{filter:invert(1)}
/* kf-seg: a segment keeps its own colours (so the chosen option stays black) and draws a double ring inside its edge. */
/* round 4: a focused segment gets the same treatment as Apply and the hero: white fill, bold black text, a 2 px white gap and
   a 3 px black ring outside it. The control lets the ring overflow while one of its segments has focus. */
.screen.kbd .sg:has(>.kf){overflow:visible !important}
.screen.kbd .sg>.kf.kf-seg{position:relative;z-index:2;outline:none !important;background:#fff !important;color:#000 !important;font-weight:800 !important;border-radius:10px;box-shadow:0 0 0 2px #fff,0 0 0 5px #000 !important}
.screen.kbd .sg>.kf.kf-seg *{color:#000 !important;stroke:#000}
/* the chosen segment keeps a tick while focused, so you still see which one is selected */
.screen.kbd .sg>.on.kf.kf-seg::before{content:'\2713';font-weight:900;margin-right:2px}

/* header */
.hdr{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:0 var(--padx)}
.hdr .ttl{font-size:var(--ft);font-weight:700;letter-spacing:-.01em}
.hdr .sub{font-size:var(--fc);color:var(--g1);margin-top:2px;display:flex;align-items:center;gap:5px}
.searchpill{display:flex;align-items:center;gap:9px;height:var(--tap);border:1.5px solid #000;border-radius:999px;padding:0 16px 0 13px;font-size:var(--fs);font-weight:600;background:#fff}
.searchpill .mute{font-weight:500}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:999px;border:1.5px solid #000;display:grid;place-items:center;background:#fff;flex:none}
.iconbtn.flat{border-color:transparent}
.offchip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #000;border-radius:999px;padding:2px 8px 2px 6px;font-size:11px;font-weight:700;color:#000;background:#fff}

/* home footer / pager */
.pager{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:6px}
.pager .pg{display:flex;align-items:center;justify-content:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:var(--fc);font-weight:600;color:var(--g1);height:var(--pgh);min-width:var(--pgh)}
.pager .pg i{width:8px;height:8px;border-radius:9px;border:1.5px solid #000;display:block}
.pager .pg.on{color:#000}
.pager .pg.on i{background:#000}
.pager .arr{width:var(--pgh);height:var(--pgh);display:grid;place-items:center;border-radius:99px}
.pager .arr.dis{opacity:.25}

/* tiles */
.tile{position:absolute;border:1px solid var(--g2);border-radius:var(--r);background:#fff;overflow:hidden}
.tile.ink{background:#000;color:#fff;border-color:#000}
.tile .tin{position:absolute;inset:0;padding:var(--tp);display:flex;flex-direction:column}
.tin>*,.hcol>*{flex-shrink:0}
.th{display:flex;align-items:baseline;gap:8px;min-height:20px}
.th.hit{padding:15px var(--tp);margin:-15px calc(-1 * var(--tp)) -15px;min-height:50px;box-sizing:border-box}
.th .lab{font-size:var(--fs);font-weight:700;letter-spacing:.005em;white-space:nowrap}
.th .meta{font-size:var(--fc);color:var(--g1);white-space:nowrap}
.th .more{margin-left:auto;font-size:var(--fc);font-weight:700;display:flex;align-items:center;gap:2px;white-space:nowrap;padding:6px 0 6px 10px;margin-top:-6px;margin-bottom:-6px}
.tile.ink .th .meta{color:var(--im)}

/* covers */
.cov{position:relative;flex:none;border-radius:3px;background:#fff;box-shadow:0 0 0 1px #000}
.cov .clip{position:absolute;inset:0;border-radius:3px;overflow:hidden}
.cov svg.art{display:block;width:100%;height:100%}
.cov.dim svg.art{opacity:.38}
.badge{position:absolute;right:-7px;bottom:-7px;z-index:2;background:#fff;border:1.5px solid #000;border-radius:99px;display:grid;place-items:center}
.dl{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid #000;padding:5px 6px 6px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.dl.big{min-height:var(--tap);border:1.5px solid #000;left:-1px;right:-1px;bottom:-1px;border-radius:0 0 3px 3px}
.dl .pb{height:5px;border:1px solid #000;border-radius:3px;overflow:hidden}
.dl .pb b{display:block;height:100%;background:#000}
.dl .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700}
.dl .x{font-size:11px;font-weight:700;text-decoration:underline}
.dlmask{position:absolute;inset:0;background:rgba(255,255,255,.55)}

/* progress */
.bar1{height:5px;border-radius:3px;background:var(--g3);overflow:hidden}
.bar1 b{display:block;height:100%;background:#000}
.segbar{display:flex;gap:2px;height:9px}
.segbar span{flex:1;background:#555;border-radius:1px;overflow:hidden;position:relative}
.segbar span b{position:absolute;left:0;top:0;bottom:0;background:#fff}
.segbar.light span{background:var(--g3)}
.segbar.light span b{background:#000}

/* buttons */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:var(--tap);padding:0 20px;border-radius:999px;font-size:var(--fb);font-weight:700;border:1.5px solid #000;background:#000;color:#fff;white-space:nowrap}
.pill.wh{background:#fff;color:#000}
.pill.inv{background:#fff;color:#000;border-color:#fff}
.pill.ghost-ink{background:transparent;color:#fff;border-color:#fff}
.pill.dis{background:var(--g4);color:var(--g1);border-color:var(--g2)}
.pill.sm{height:var(--tap);padding:0 16px;font-size:var(--fs)}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px}
.hair{height:1px;background:var(--g3);flex:none}

/* sub-screen header */
.shdr{height:var(--shh);display:flex;align-items:center;gap:8px;padding:0 var(--padx) 0 calc(var(--padx) - 8px);border-bottom:1.5px solid #000}
.shdr .t{font-size:var(--fm);font-weight:700;flex:1;min-width:0}
.shdr .t small{display:block;font-size:var(--fc);font-weight:500;color:var(--g1);margin-top:1px}
.backbtn{display:flex;align-items:center;gap:2px;height:var(--tap);min-width:var(--tap);padding:0 8px;margin-right:10px;border-radius:999px;font-weight:700;font-size:var(--fs);flex:none}

/* modal + sheet */
.scrim{position:absolute;inset:0;background:rgba(255,255,255,.62);z-index:10}
.scrim.dark{background:rgba(0,0,0,.28)}
.card{position:absolute;background:#fff;border:2px solid #000;border-radius:20px;z-index:11}
.sheet{z-index:11;position:absolute;left:var(--inset);right:var(--inset);bottom:var(--inset);background:#fff;border:2px solid #000;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 12px 12px var(--sp);border-bottom:1px solid var(--g3)}
.sheet .sh .t{font-size:var(--fm);font-weight:700;flex:1}
.sheet .sh .t small{display:block;font-size:var(--fc);color:var(--g1);font-weight:500;margin-top:2px}
.sheet .sb{flex:1;min-height:0;padding:0 var(--sp);position:relative}
.sheet .sf{display:flex;align-items:center;justify-content:space-between;padding:8px var(--sp) 12px;border-top:1px solid var(--g3);font-size:var(--fc);font-weight:600}
.grab{width:44px;height:5px;border-radius:9px;background:var(--g3);margin:8px auto 0}

/* chips + segmented */
.chip{display:inline-flex;align-items:center;gap:6px;height:var(--tap);padding:0 12px;border:1.5px solid #000;border-radius:999px;font-size:var(--fs);font-weight:600;white-space:nowrap}
.chip.on{background:#000;color:#fff}
/* a picker value with no books under the other filters: gray (X4: its lighter gray, on white only), no number */
.fsheet .fzero, .fsheet .fzero *{color:var(--g1) !important}
.x4 .fsheet .fzero, .x4 .fsheet .fzero *{color:#808080 !important}
.fsheet .fzero span[style*="border:2px"]{border-color:currentColor !important}
/* where stats come from: shown only when they are this reader's alone */
.tile .srcnote{flex:none;margin-left:8px;font-size:11px;font-weight:700;border:1.5px solid #000;border-radius:999px;padding:1px 7px;white-space:nowrap}
.tile:has(.srcnote) .th > .meta, .tile:has(.srcnote) .th > span[style*='margin-left:auto']{display:none}
.tile:has(.srcnote) .th{flex-wrap:wrap;row-gap:3px}
.fsheet .sf{display:flex;align-items:center;justify-content:space-between;padding:4px 16px;font-size:var(--fc);font-weight:600;border-top:1px solid var(--g3)}
.sg{display:flex;
border:1.5px solid #000;border-radius:12px;overflow:hidden;height:calc(var(--tap) + 3px)}
.sg>*{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--fs);font-weight:600;min-width:0}
.sg>*+*{border-left:1.5px solid #000}
.sg>.on{background:#000;color:#fff}
.stp{display:flex;align-items:center;border:1.5px solid #000;border-radius:12px;height:calc(var(--tap) + 3px);overflow:hidden}
.stp>span{flex:1;text-align:center;font-weight:700;font-size:var(--fb)}
.stp>button,.stp>div[data-act]{width:var(--tap);height:100%;display:grid;place-items:center;border:0;background:#fff}
.stp>:first-child{border-right:1.5px solid #000}
.stp>:last-child{border-left:1.5px solid #000}
.swrow{display:flex;align-items:center;gap:10px;min-height:var(--tap);font-size:var(--fs);font-weight:600;padding:0 4px;border-radius:12px}
.sw{width:46px;height:26px;border-radius:99px;border:1.5px solid #000;position:relative;flex:none;background:#fff}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:99px;background:#000}
.sw.on{background:#000}
.sw.on i{left:21px;background:#fff}

/* edit mode */
.tile.ed{border:2px dashed #000;overflow:visible}
.tile.ed .tin{border-radius:var(--r);overflow:hidden}
.tile.ed.sel{border:3px solid #000}
/* The tag straddles the tile's bottom edge: half in the padding, half in the gutter, so it never covers a caption. */
.edtag{position:absolute;right:10px;bottom:-11px;height:20px;z-index:4;display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #000;border-radius:999px;padding:0 9px 0 7px;font-size:11.5px;font-weight:700;color:#000;white-space:nowrap}
.edcover{position:absolute;inset:0;z-index:3}
.tile.ed .tin{opacity:.5}
.tile.ed.sel .tin{opacity:1}
.slot{position:absolute;border:1.5px dotted var(--g2);border-radius:var(--r);display:grid;place-items:center;color:var(--g1)}
.edbar{position:absolute;left:var(--inset);right:var(--inset);bottom:var(--inset);background:#fff;border:2px solid #000;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.edbar .r{display:flex;gap:8px;align-items:center}
.ebtn{height:var(--tap);min-width:var(--tap);padding:0 12px;border:1.5px solid #000;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:var(--fs);font-weight:700;background:#fff;white-space:nowrap}
.ebtn.k{background:#000;color:#fff}
.ebtn.dis{opacity:.3}

/* reader */
.page{position:absolute;inset:0;background:#fff}
.ptext{position:absolute;overflow:hidden;font-family:var(--serif);text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.ptext p{margin:0;text-indent:1.4em}
.ptext p.first{text-indent:0}
.ptext p.first::first-letter{font-size:3.1em;float:left;line-height:.82;padding:.08em .08em 0 0;font-weight:400}
.ptext .chh{text-align:center}
.ptext .chh .n{font-family:var(--sans);font-size:.62em;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--g1)}
.ptext .chh .nm{font-style:italic}
.pclock{position:absolute;left:0;right:0;text-align:center;font-size:var(--fc);color:#000;font-weight:600}
.pstatus{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;font-size:var(--fc);color:#000}
.zone{position:absolute}
.panel{z-index:11;position:absolute;left:var(--inset);right:var(--inset);background:#fff;border:2px solid #000;border-radius:20px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px;border-radius:14px;font-size:var(--fc);font-weight:700;text-align:center}
.ptile .circ{width:52px;height:52px;border-radius:99px;border:1.5px solid #000;display:grid;place-items:center}
.ptile.k .circ{background:#000;color:#fff}
.sl{position:relative;height:var(--tap)}
.sl .tr{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--g3);border-radius:3px}
.sl .fi{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;background:#000;border-radius:3px}
.sl .tk{position:absolute;top:50%;width:2px;height:12px;margin-top:-6px;background:#000}
.sl .tk.lt{background:var(--g2)}
.sl .th2{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:99px;background:#000;border:3px solid #fff;box-shadow:0 0 0 1.5px #000}
.qs .lbl{font-size:var(--fc);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g1);margin-bottom:6px;display:flex;justify-content:space-between}
.krow{display:flex;align-items:center;gap:10px;height:var(--tap);border-bottom:1px solid var(--g3);font-size:var(--fb)}
.key{display:grid;place-items:center;border:1.5px solid #000;border-radius:8px;font-weight:700;font-size:var(--fb);background:#fff}
.key.k{background:#000;color:#fff}

/* stock-look KOReader menu */
.kor{z-index:11;position:absolute;left:0;right:0;top:0;background:#fff;border-bottom:2px solid #000;font-family:"Noto Sans",Arial,sans-serif}
.kor .tabs{display:flex;border-bottom:1px solid #000}
.kor .tabs div{flex:1;display:grid;place-items:center;height:52px}
.kor .tabs div.on{border-bottom:4px solid #000}
.kor .it{display:flex;justify-content:space-between;align-items:center;padding:0 18px;height:46px;border-bottom:1px solid #bbb;font-size:15px}
</style>
</head>
<body>
<div class="shell">
  <div class="stage">
    <div class="bar">
      <div class="seg" id="devseg">
        <button data-dev="m8c">Android M8C</button>
        <button data-dev="x4pro">X4 Pro · touch</button>

// ---------- synthetic covers (SVG, grayscale) ----------
function wrap(t, n){ const w = t.split(' '); const out = []; let cur = ''; for (const x of w){ if ((cur + ' ' + x).trim().length > n && cur){ out.push(cur); cur = x; } else cur = (cur + ' ' + x).trim(); } if (cur) out.push(cur); return out; }
function tlines(lines, x, y, size, lh, attrs){ return lines.map((l, i) => `<text x="${x}" y="${y + i*lh}" font-size="${size}" ${attrs}>${esc(l)}</text>`).join(''); }
const SERIF_SVG = `font-family="Iowan Old Style, Palatino, Georgia, serif"`, SANS_SVG = `font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"`;
function coverSVG(b){
  const T = b.t, A = b.a.toUpperCase();
  const s = b.cs % 8; let g = '';
  if (s === 0){ // ink, moon
    const L = wrap(T, 11); g = `<rect width="200" height="300" fill="#000"/><circle cx="100" cy="196" r="46" fill="none" stroke="#8c8c8c" stroke-width="2"/><circle cx="118" cy="184" r="40" fill="#000"/><circle cx="100" cy="196" r="46" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="72 400" transform="rotate(100 100 196)"/>`+
      tlines(L, 100, 66, 25, 28, `${SERIF_SVG} fill="#fff" text-anchor="middle"`)+`<rect x="80" y="${78 + (L.length-1)*28}" width="40" height="1.5" fill="#8c8c8c"/><text x="100" y="276" font-size="10" letter-spacing="2.5" ${SANS_SVG} fill="#cfcfcf" text-anchor="middle">${esc(A)}</text>`;
  } else if (s === 1){ // paper with band
    const L = wrap(T, 12); g = `<rect width="200" height="300" fill="#ececec"/><rect y="104" width="200" height="${44 + L.length*24}" fill="#000"/>`+
      tlines(L, 16, 136, 22, 24, `${SERIF_SVG} font-style="italic" fill="#fff"`)+`<text x="16" y="40" font-size="10" letter-spacing="2.5" ${SANS_SVG} font-weight="700" fill="#000">${esc(A)}</text><path d="M16 268h168" stroke="#000" stroke-width="1"/><text x="16" y="286" font-size="9" letter-spacing="2" ${SANS_SVG} fill="#555">A NOVEL</text>`;
  } else if (s === 2){ // arcs
    const L = wrap(T, 10); let arcs = ''; for (let i = 0; i < 7; i++) arcs += `<circle cx="0" cy="300" r="${60 + i*22}" fill="none" stroke="${i%2 ? '#8c8c8c' : '#000'}" stroke-width="${i%2 ? 1.5 : 3}"/>`;
    g = `<rect width="200" height="300" fill="#fff"/>${arcs}`+tlines(L, 16, 44, 24, 26, `${SANS_SVG} font-weight="800" fill="#000" letter-spacing="-.5"`)+`<text x="184" y="286" font-size="10" letter-spacing="2" ${SANS_SVG} font-weight="600" fill="#000" text-anchor="end">${esc(A)}</text>`;
  } else if (s === 3){ // mountains
    const L = wrap(T, 12); g = `<rect width="200" height="300" fill="#cfcfcf"/><circle cx="142" cy="150" r="26" fill="#fff"/><path d="M0 230L52 160l34 40 40-62 74 92v70H0z" fill="#555"/><path d="M0 262l60-46 46 30 44-26 50 40v40H0z" fill="#000"/>`+
      tlines(L, 100, 50, 22, 25, `${SERIF_SVG} fill="#000" text-anchor="middle"`)+`<text x="100" y="${70 + (L.length-1)*25}" font-size="9.5" letter-spacing="2.5" ${SANS_SVG} fill="#000" text-anchor="middle">${esc(A)}</text>`;
  } else if (s === 4){ // swiss initial
    const L = wrap(T, 13); g = `<rect width="200" height="300" fill="#fff"/><text x="-6" y="200" font-size="230" ${SERIF_SVG} fill="#ececec" font-weight="700">${esc(T.replace(/^(The|A) /,'')[0])}</text><rect x="16" y="16" width="168" height="4" fill="#000"/>`+
      tlines(L, 16, 222 - (L.length-1)*22, 20, 22, `${SANS_SVG} font-weight="700" fill="#000"`)+`<text x="16" y="284" font-size="10" letter-spacing="2" ${SANS_SVG} fill="#555">${esc(A)}</text>`;
  } else if (s === 5){ // classic frame
    const L = wrap(T, 11); g = `<rect width="200" height="300" fill="#555"/><rect x="12" y="12" width="176" height="276" fill="none" stroke="#cfcfcf" stroke-width="1.5"/><rect x="18" y="18" width="164" height="264" fill="none" stroke="#cfcfcf" stroke-width=".8"/><path d="M100 ${120 + L.length*13} l7 7-7 7-7-7z" fill="#fff"/>`+
      tlines(L, 100, 118 - (L.length-1)*13, 23, 26, `${SERIF_SVG} fill="#fff" text-anchor="middle"`)+`<text x="100" y="252" font-size="10" letter-spacing="2.5" ${SANS_SVG} fill="#ececec" text-anchor="middle">${esc(A)}</text>`;
  } else if (s === 6){ // stripes + box
    const L = wrap(T, 12); let st = ''; for (let i = -300; i < 300; i += 22) st += `<path d="M${i} 0l300 300" stroke="#000" stroke-width="8"/>`;
    g = `<rect width="200" height="300" fill="#fff"/><g clip-path="inset(0 0 50% 0)"><svg width="200" height="150">${st}</svg></g><rect x="16" y="128" width="168" height="${34 + L.length*24}" fill="#000"/>`+
      tlines(L, 28, 160, 21, 24, `${SANS_SVG} font-weight="700" fill="#fff"`)+`<text x="16" y="284" font-size="10" letter-spacing="2" ${SANS_SVG} font-weight="600" fill="#000">${esc(A)}</text>`;
  } else { // halftone
    const L = wrap(T, 11); let d = ''; for (let y = 0; y < 12; y++) for (let x = 0; x < 9; x++) d += `<circle cx="${12 + x*22}" cy="${150 + y*13}" r="${1 + y*0.42}" fill="#000"/>`;
    g = `<rect width="200" height="300" fill="#8c8c8c"/>${d}`+tlines(L, 16, 52, 25, 27, `${SERIF_SVG} font-weight="700" fill="#fff"`)+`<text x="16" y="${76 + (L.length-1)*27}" font-size="10" letter-spacing="2.5" ${SANS_SVG} fill="#fff">${esc(A)}</text>`;
  }
  return `<svg class="art" viewBox="0 0 200 300" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
}
function coverEl(b, w, h, o = {}){
  const dl = S.downloads[b.id];
  const off = S.offline && !b.dev;
  const badge = !b.dev && dl == null && w >= 40 ? `<div class="badge" style="width:${Math.round(clamp(w*.28,20,30))}px;height:${Math.round(clamp(w*.28,20,30))}px">${ic(off ? 'cloudoff' : 'clouddl', Math.round(clamp(w*.2,13,19)), 2.2)}</div>` : '';
  let ov = '';
  if (dl != null){
    ov = w >= 64 ? `<div class="dlmask"></div><div class="dl big" data-act="cancel:${b.id}" data-fk="cancel-${b.id}"><div class="row"><span class="num">${Math.round(dl)}%</span><span class="x">Cancel</span></div><div class="pb"><b style="width:${dl}%"></b></div></div>`
                 : `<div class="dlmask"></div><div class="dl" style="padding:3px"><div class="pb"><b style="width:${dl}%"></b></div></div>`;

  return `<div class="cov${off ? ' dim' : ''}" style="width:${w}px;height:${h}px;${o.style||''}" ${act}><div class="clip">${coverSVG(b)}${ov}</div>${badge}</div>`;
}

// ---------- reading maths ----------
function chapters(b){ const r = rng(b.id.charCodeAt(1)*31 + b.pages); const n = b.ch; const w = []; let s = 0; for (let i = 0; i < n; i++){ const x = .6 + r(); w.push(x); s += x; } let p = 1; return w.map((x, i) => { const st = p; p += Math.max(4, Math.round(x / s * b.pages)); return {i, start:st}; }).map((c, i, a) => ({...c, end: i < a.length-1 ? a[i+1].start - 1 : b.pages})); }
const CH_NAMES = ['The Keeper\'s Log','Salt on the Glass','A Hundred and Nine Steps','Fog Signal','The Inventory','Low Tide at Merrow','Paraffin','The Other Hand','What the Gulls Know','Ledger Lines','Night Watch','The Harbourmaster','Small Weather','The Lantern Room','Second Lens','A Letter, Unsent','Drowned Bells','The Survey','Wintering','Flood','The Return','Coda: Clear Night'];
function curPage(b){ return S.pages[b.id] != null ? S.pages[b.id] : Math.max(1, Math.round((b.prog || 0) * b.pages)); }
function chapterOf(b, p){ const cs = chapters(b); return cs.find(c => p >= c.start && p <= c.end) || cs[cs.length-1]; }
const PACE = 1.55; // minutes per page
function forecast(b){ const left = (b.pages - curPage(b)) * PACE; const perDay = 52; const days = Math.max(1, Math.ceil(left / perDay)); return {left, by: days <= 1 ? 'tomorrow' : DAYS[(TODAY + days) % 7]}; }

function cell(g){ const cw = (g.W - 2*g.padx - (g.cols-1)*g.gap) / g.cols; const ch = (g.H - g.head - g.foot - (g.rows-1)*g.gap) / g.rows; return {cw, ch}; }
function tilePx(g, p){ const {cw, ch} = cell(g); return {x: g.padx + p.x*(cw+g.gap), y: g.head + p.y*(ch+g.gap), w: p.w*cw + (p.w-1)*g.gap, h: p.h*ch + (p.h-1)*g.gap}; }

function coverRow(t, books, label, meta, act, fk, captions){
  const x4 = t.dev === 'x4';
  const capH = captions ? 18 : 0;
  const ih = t.h - 2*t.tp - 26;
  const iw = t.w - 2*t.tp; const gap = x4 ? 10 : 14; const vgap = 14;
  // Narrow and tall (X4 1×3): a 2×2 mini-grid of covers. Otherwise one or two shelves that fill the height.
  const mini = t.w < 260 && ih >= 200;
  const rowsN = mini || ih >= 330 ? 2 : 1;
  let ch = Math.min(Math.floor((ih - (rowsN - 1)*vgap) / rowsN) - capH - 10, 210), cw = Math.round(ch * 2/3);
  let n = Math.floor((iw + gap) / (cw + gap));
  if (n < 2 && t.w < 260){ n = 2; cw = Math.floor((iw - gap)/2); ch = Math.round(cw * 1.5); const fitH = Math.floor((ih - (rowsN - 1)*vgap) / rowsN) - 10 - capH; if (ch > fitH){ ch = fitH; cw = Math.round(ch*2/3); } }
  if (t.w > 300 && n < 3){ n = 3; cw = Math.floor((iw - 2*gap) / 3); ch = Math.round(cw * 1.5); }
  // mini-grid: use the whole height (no shelf padding) so the covers are as big as they can be and sit right under the header
  if (mini){ const mv = 8; ch = Math.floor((ih - mv) / 2) - capH; cw = Math.round(ch * 2/3); if (2*cw + gap > iw){ cw = Math.floor((iw - gap) / 2); ch = Math.round(cw * 1.5); } n = 2; }
  const per = n; n = Math.min(n * rowsN, books.length);

// Heat levels. M8C: four greys + black. X4: white with an outline, #c0c0c0, #808080, black, and a ring for today.
// Patterns only when a cell is 12 px or more (then the top level gets a hatch to split it from the one below).
const HEAT_LEVEL = v => v <= 0 ? 0 : v < 30 ? 1 : v < 60 ? 2 : v < 110 ? 3 : 4;
const HEAT_FILL_M8C = ['var(--g4)', 'var(--g3)', 'var(--g2)', '#555', '#000'];
const HEAT_DEFS = `<defs><pattern id="hh" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#fff"/><rect width="1.4" height="3" fill="#000"/></pattern></defs>`;
function heatCell(x, y, c, lv, x4, today){
  const rx = c > 7 ? 2 : 1.2;
  if (!x4) return `<rect x="${x}" y="${y}" width="${c}" height="${c}" rx="${rx}" fill="${HEAT_FILL_M8C[lv]}"${today ? ' stroke="#000" stroke-width="1.5"' : ''}/>`;
  const fill = c >= 12 ? ['#fff', '#c0c0c0', '#808080', 'url(#hh)', '#000'][lv] : ['#fff', '#c0c0c0', '#808080', '#000', '#000'][lv];
  const st = lv === 0 || today ? ` stroke="#000" stroke-width="${today ? 2 : 1}"` : '';
  const o = today ? 1 : lv === 0 ? .5 : 0; return `<rect x="${(+x + o).toFixed(1)}" y="${(+y + o).toFixed(1)}" width="${(c - 2*o).toFixed(1)}" height="${(c - 2*o).toFixed(1)}" rx="${rx}" fill="${fill}"${st}/>`;
}
function heatSwatch(lv, x4, today, cell){ const c = x4 && cell >= 12 ? 12 : 11; return `<svg width="${c}" height="${c}" style="display:block">${x4 ? HEAT_DEFS : ''}${heatCell(0, 0, c, lv, x4, today)}</svg>`; }
