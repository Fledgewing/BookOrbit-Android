org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Robolectric (tests only) pulls androidx.test; the app itself has no AndroidX dependency.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Maven Central answers shared CI runners with 429 Too Many Requests. Gradle retries 429, but by
# default only 3 tries 1 s apart; this waits 5, 10, 20, 40 and 80 s over 6 tries.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=5000
