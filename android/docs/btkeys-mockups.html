<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clicker buttons mockups</title>
<style>
  :root { --ink: #000; --g1: #444; --g2: #777; --g3: #bbb; --g4: #e6e6e6; --paper: #fff; }
  body { margin: 0; padding: 24px 16px; background: #f2f2f2; color: var(--ink);
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: var(--g1); max-width: 760px; }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; width: 351px; max-width: 100%; }
  /* M8C: 1404 x 1872 px, shown at 1/4 scale */
  .screen { width: 351px; max-width: 100%; height: 468px; background: var(--paper); border: 2px solid var(--ink);
            border-radius: 6px; box-sizing: border-box; padding: 12px 14px; overflow: hidden;
            display: flex; flex-direction: column; font-size: 13px; line-height: 1.3; }
  figcaption { font-size: 13px; color: var(--g1); margin-top: 8px; }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .hdr b { font-size: 18px; }
  .btn { border: 1.5px solid var(--ink); border-radius: 5px; padding: 6px 10px; text-align: center; font-weight: 600; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .card { border: 1.5px solid var(--ink); border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--g4); }
  .row:last-child { border-bottom: 0; }
  .row small, .sub { display: block; color: var(--g2); font-size: 10.5px; }
  .row b { white-space: nowrap; text-align: right; }
  .key { display: inline-block; border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 700; margin-right: 4px; }
  .sec { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--g1); margin: 6px 0 2px; }
  .foot { margin-top: auto; display: flex; gap: 8px; }
  .foot .btn { flex: 1; }
  .big { font-size: 22px; font-weight: 800; text-align: center; margin: 22px 0 6px; }
  .press { margin: 14px auto; width: 120px; height: 120px; border: 3px dashed var(--ink); border-radius: 50%;
           display: flex; align-items: center; justify-content: center; font-weight: 700; text-align: center; }
  .radio { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--g4); }
  .radio i { width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 50%; flex: none; }
  .radio.on i { background: radial-gradient(var(--ink) 45%, var(--paper) 50%); }
  .zones { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 70px; border: 1.5px solid var(--ink); border-radius: 4px; margin: 4px 0 6px; }
  .zones div { border-right: 1px dashed var(--g2); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--g2); }
  .zones div:last-child { border-right: 0; }
  .zones .on { background: var(--ink); color: var(--paper); font-weight: 700; }
  .check { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--g4); align-items: flex-start; }
  .check i { width: 14px; height: 14px; border: 1.5px solid var(--ink); flex: none; margin-top: 2px; font-style: normal; font-size: 11px; line-height: 14px; text-align: center; font-weight: 800; }
  .check .t { flex: 1; }
  .check.need { border: 2px solid var(--ink); border-radius: 5px; padding: 6px; margin: 4px 0; }
  .note { font-size: 11px; color: var(--g1); border-left: 3px solid var(--ink); padding-left: 7px; margin: 6px 0; }
</style>
</head>
<body>
<h1>Clicker buttons: mockups (draft)</h1>
<p class="lead">BookSync Companion › Settings › Clicker buttons. M8C 1404 × 1872 at quarter scale, black on white,
drawn once per change (no animation). Design: <code>BTKEYS-DESIGN.md</code>.</p>

<div class="grid">

<figure>
  <div class="screen">
    <div class="hdr"><b>Clicker buttons</b><span class="btn sm">‹ Back</span></div>
    <div class="row" style="border:0;padding-top:0"><span><b style="font-size:15px">Page clicker</b><small>Bluetooth · BT-Remote 05ac:022c · connected</small></span><span class="btn sm">Forget</span></div>
    <div class="card">
      <div class="row"><span><span class="key">Vol −</span>press</span><b>Next page</b></div>
      <div class="row"><span><span class="key">Vol +</span>press</span><b>Previous page</b></div>
      <div class="row"><span><span class="key">Vol +</span>hold</span><b>Sync and sleep<small>other apps: Sleep</small></b></div>
      <div class="row"><span><span class="key">Enter</span>press</span><b>Frontlight on/off<small>KOReader only</small></b></div>
      <div class="row"><span><span class="key">Enter</span>double</span><b>Home</b></div>
    </div>
    <div class="btn">+ Add a button</div>
    <div class="sec" style="margin-top:12px">Other clickers</div>
    <div class="row"><span>Ring remote<small>sends taps, not buttons: can't be mapped</small></span><b class="sub">—</b></div>
    <div class="note">Key Mapper also remaps keys. Turn it off once these buttons work; you can then uninstall it.</div>
    <div class="foot"><div class="btn">+ Add a clicker</div><div class="btn">Page taps per app</div></div>
  </div>
  <figcaption>1. Button map for one clicker. Each row: button, press kind, action. Tap a row → screen 3. Long and double appear only for buttons that use them.</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="hdr"><b>Add a button</b><span class="btn sm">Cancel</span></div>
    <div class="big">Press a button on your clicker</div>
    <div class="sub" style="text-align:center">Waiting… Bluetooth clickers only; the reader's own buttons are ignored here.</div>
    <div class="press">press<br>now</div>
    <div class="card">
      <div class="row"><span>Heard</span><b><span class="key">Media next</span>key 87 · scan 163</b></div>
      <div class="row"><span>From</span><b>BT-Remote<small>05ac:022c · Bluetooth</small></b></div>
      <div class="row"><span>KOReader alone</span><b>ignores it<small>BookSync adds it</small></b></div>
    </div>
    <div class="sec">This button, when</div>
    <div class="radio on"><i></i>pressed</div>
    <div class="radio"><i></i>held (0.6 s)</div>
    <div class="radio"><i></i>pressed twice<small class="sub">&nbsp;adds a short wait to single presses</small></div>
    <div class="foot"><div class="btn">Press again</div><div class="btn solid">Next: pick action</div></div>
  </div>
  <figcaption>2. Capture. Records keycode, scancode and the InputDevice name/ids; a new device starts a new clicker profile. A pointer-only device gets "sends taps, not buttons".</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="hdr"><b><span class="key">Media next</span> press</b><span class="btn sm">‹ Back</span></div>
    <div class="sec">Action</div>
    <div class="radio on"><i></i>Next page</div>
    <div class="radio"><i></i>Previous page</div>
    <div class="radio"><i></i>Home</div>
    <div class="radio"><i></i>Back</div>
    <div class="radio"><i></i>Frontlight on/off <span class="sub">&nbsp;KOReader only</span></div>
    <div class="radio"><i></i>Sync and sleep <span class="sub">&nbsp;other apps: Sleep</span></div>
    <div class="radio"><i></i>Nothing (the app gets the key)</div>
    <div class="sec" style="margin-top:8px">Next page in</div>
    <div class="row"><span>KOReader</span><b>exact page turn</b></div>
    <div class="row"><span>Readest<small>tap here</small></span><b class="sub">change</b></div>
    <div class="zones"><div>prev</div><div>menu</div><div class="on">tap</div></div>
    <div class="row"><span>Meebook reader</span><b>tap right third</b></div>
    <div class="row"><span>+ Override for another app</span><b class="sub">›</b></div>
  </div>
  <figcaption>3. Action, with per-app overrides for page actions (zone: left/right third, top/bottom half, swipe, or nothing). Vendor reader defaults come from Vendor.kt.</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="hdr"><b>Setup (9/10)</b><span class="btn sm">‹ Back</span></div>
    <div class="check"><i>✓</i><div class="t">Set BookSync as Home app<span class="sub">done</span></div></div>
    <div class="check"><i>✓</i><div class="t">Not disabled by the system (KOReader, Tailscale, BookSync)<span class="sub">done</span></div></div>
    <div class="check"><i>✓</i><div class="t">Battery: Unrestricted (BookSync)<span class="sub">done</span></div></div>
    <div class="check"><i>✓</i><div class="t">Allow "lock screen" (device admin)<span class="sub">done</span></div></div>
    <div class="check need"><i></i><div class="t"><b>Clicker buttons (accessibility)</b>
      <span class="sub">Off: was it frozen or turned off? Clicker buttons work only in KOReader until it's on.</span>
      <span class="sub" style="margin-top:4px">BookSync uses it only to see button presses, which app is in front, and to send page taps, Home and Back. It can't read what's on screen.</span>
      <div style="display:flex;gap:6px;margin-top:6px"><span class="btn sm solid">Fix</span><span class="btn sm">Don't ask about this</span></div>
    </div></div>
    <div class="check"><i>✓</i><div class="t">KOReader patch installed (v0.4.0)<span class="sub">done</span></div></div>
    <div class="note">Fix opens Settings › Accessibility › BookSync Companion. Shown only once a clicker is mapped; a later freeze or force-stop turns it back into "Setup needs you".</div>
  </div>
  <figcaption>4. Setup checklist row. Done = enabled in Android and connected (onServiceConnected seen, no onUnbind since).</figcaption>
</figure>

</div>
</body>
</html>
