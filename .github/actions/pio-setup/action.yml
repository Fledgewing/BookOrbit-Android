name: PlatformIO setup
description: >
  Python, a pinned uv, the PlatformIO package cache and pioarduino's PlatformIO Core, as
  upstream's release workflow sets them up: one setup for the firmware builds (xteink.yml) and
  the simulator (release-tests.yml).
inputs:
  pio-core:
    description: pioarduino PlatformIO Core version
    required: true
  platformio-ini:
    description: Path of the CrossInk checkout's platformio.ini (the cache key)
    required: true
  cache-prefix:
    description: Cache key prefix, so the device and simulator package sets stay apart
    required: false
    default: pio
  extra-apt:
    description: Extra apt packages (the simulator's SDL2, OpenSSL and wolfSSL)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Cache PlatformIO packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.platformio/packages
          ~/.platformio/platforms
        key: ${{ runner.os }}-${{ inputs.cache-prefix }}-${{ inputs.pio-core }}-${{ hashFiles(inputs.platformio-ini) }}

    - name: Install PlatformIO Core
      shell: bash
      env:
        PIO_CORE: ${{ inputs.pio-core }}
        EXTRA_APT: ${{ inputs.extra-apt }}
      run: |
        set -euo pipefail
        uv pip install --system -U "https://github.com/pioarduino/platformio-core/archive/refs/tags/v${PIO_CORE}.zip"
        if [ -n "$EXTRA_APT" ]; then
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # a list of package names
          sudo apt-get install -y --no-install-recommends $EXTRA_APT
        fi
