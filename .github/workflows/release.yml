# Builds and publishes an Android release: the signed BookSync Companion APK, the version-stamped
# KOReader patch, SHA256SUMS, license and notice files, all with keyless build-provenance
# attestations. Both pieces update themselves from these releases (README "Updates").
#
# Tags: v<version> (AGENTS.md "Releases"); android-v<version> also builds. Firmware releases
# (xteink-v<version>, .github/workflows/xteink.yml) never take "latest": that stays Android.
#
# Test builds (AGENTS.md "Test builds: sideload first, release after"): run it by hand with
# publish off, on any branch. The same signed APK and stamped plugin zip are built as version
# <next patch>-0.test.<run> (tools/android-test-version.sh) and uploaded as the workflow artifact
# android-test-<version>. No tag, no release, no attestation: no updater ever sees a test build.
# tools/sideload-android.sh <run id> installs it over USB.
#
# The signing key never meets Gradle: the build job compiles and packages with no secrets and
# hands the unsigned APK over as an artifact; the sign job, which never runs Gradle or the
# build's dependencies, signs it with apksigner, checks the certificate and publishes. Only
# that job can write to the repo.
name: release

on:
  push:
    tags: ["android-v*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.7.1 (ignored for a test build)"
        required: false
        default: ""
      publish:
        description: "Publish a release. Off: a test build of this branch, uploaded only as a workflow artifact"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && format('test-{0}', github.run_id) || (github.event.inputs.tag || github.ref_name) }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # false only for a test build (workflow_dispatch with publish off).
  PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
  # SHA-256 of the release signing certificate. A build signed with anything else fails.
  EXPECTED_CERT_SHA256: "F5:07:8C:85:F8:23:18:30:C1:F1:8D:93:FE:30:D7:1F:87:93:6C:1D:94:24:F2:D8:15:98:3D:1D:21:A9:0A:15"

jobs:
  # The emulated release tests on the release commit (release-tests.yml): the server kit and the
  # companion's JVM tests, Robolectric's install-session states included. Nothing publishes
  # unless they pass.
  tests:
    uses: ./.github/workflows/release-tests.yml
    with:
      platform: android
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # Unsigned build: no secrets and a read-only token while Gradle and its dependencies run.
  build:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release builds its tag; a test build the commit it was started on.
          ref: ${{ env.PUBLISH == 'true' && env.TAG || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version from the tag
        id: ver
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != true ]; then
            VER="$(git tag -l | tools/android-test-version.sh "$GITHUB_RUN_NUMBER")"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Test build $VER of $GITHUB_REF_NAME $GITHUB_SHA: workflow artifact only, nothing published"
            exit 0
          fi
          VER="${TAG#android-}"
          VER="${VER#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-pre]"; exit 1
          fi
          # A test version is never released: the updaters skip it (TestBuild).
          if [[ "$VER" == *-0.test.* ]]; then
            echo "::error::$TAG is a test-build version; run with publish off instead"; exit 1
          fi
          PRE=false; [[ "$VER" == *-* ]] && PRE=true
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VER (pre-release: $PRE)"

      # Downloads only, as in android.yml: Gradle User Home restored read-only from main's cache
      # (tags never write it). No Gradle build cache (org.gradle.caching is off) and no project
      # build/ directories, so the release still builds from a clean checkout.
      - uses: ./.github/actions/android-setup

      # The same checks android.yml runs; the companion's JVM tests ran in release-tests stage 2.
      - uses: ./.github/actions/plugin-tests
        timeout-minutes: 5

      - uses: ./.github/actions/script-checks

      - name: Build the unsigned companion APK
        working-directory: android/companion
        run: ./gradlew --no-daemon -PorbitVersion="${{ steps.ver.outputs.version }}" assembleRelease </dev/null

      - name: Stage the unsigned APK, the plugin zip and the license files
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp android/companion/app/build/outputs/apk/release/app-release-unsigned.apk "dist/orbit-companion-$VER-unsigned.apk"
          # The BookSync KOReader plugin, zipped with its version stamped into main.lua (the
          # script refuses a stamp that didn't take).
          android/koreader/package.sh "$VER" dist/orbit.koplugin.zip
          # Licenses: the companion (MIT), the plugin (AGPL-3.0-or-later).
          cp android/companion/LICENSE dist/LICENSE-companion-MIT.txt
          cp android/koreader/LICENSE dist/LICENSE-koreader-plugin-AGPL-3.0.txt
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Signs and publishes. Never checks out or runs the build: it takes the build job's files,
  # signs the APK, checks the signing certificate and publishes.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VER: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-unsigned
          path: dist

      # apksigner and zipalign from the runner image's Android SDK (no SDK setup action here).
      - name: Sign the companion APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ks="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$ks"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks")
          unsigned="dist/orbit-companion-$VER-unsigned.apk"
          "$BT/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/orbit-companion-$VER.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$unsigned" "$RUNNER_TEMP/aligned.apk" "dist/orbit-companion-$VER.apk.idsig"

      - name: Check the APK signing certificate
        id: cert
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          OUT="$("$APKSIGNER" verify --print-certs dist/orbit-companion-*.apk)"
          echo "$OUT" | grep -i "certificate SHA-256" || true
          GOT="$(echo "$OUT" | sed -nE 's/.*[Cc]ertificate SHA-256 digest: ([0-9a-fA-F]+).*/\1/p' | head -1 | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//')"
          echo "APK signing cert SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate $GOT is not the release certificate $EXPECTED_CERT_SHA256"
            exit 1
          fi
          echo "sha256=$GOT" >> "$GITHUB_OUTPUT"

      # The release key signs the plugin zip (docs/design/release-signing.md); the companion checks
      # it before installing. The key is in this step's environment only; BookSync's signing tool is
      # the only code checked out here.
      - name: Check out the signing tool
        if: env.PUBLISH == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: orbify
          persist-credentials: false
          sparse-checkout: |
            tools/feed-keys
            shared

      - name: Sign the plugin zip
        if: env.PUBLISH == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if jq -e '.enforce' orbify/shared/release-signing.json >/dev/null; then
              echo "::error::signatures are enforced but the secret RELEASE_SIGNING_KEY is not set"; exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set: the plugin zip is unsigned"
            exit 0
          fi
          orbify/tools/feed-keys/feed-keys sign --tag "$TAG" dist/orbit.koplugin.zip > "$RUNNER_TEMP/SIGNATURES"
          if [ -n "$(jq -r .root_public_key orbify/shared/release-signing.json)" ]; then
            orbify/tools/feed-keys/feed-keys verify --tag "$TAG" "$RUNNER_TEMP/SIGNATURES" dist/orbit.koplugin.zip
          fi
          mv "$RUNNER_TEMP/SIGNATURES" dist/SIGNATURES

      - name: Notices and checksums
        run: |
          set -euo pipefail
          # The third-party notices the app shows in Settings (generated into the APK at build time).
          unzip -p "dist/orbit-companion-$VER.apk" assets/open_source_licenses.txt > dist/THIRD-PARTY-NOTICES.txt
          test -s dist/THIRD-PARTY-NOTICES.txt
          (cd dist && sha256sum -- *.apk *.zip *.txt > SHA256SUMS)
          rm -rf orbify
          cat dist/SHA256SUMS

      - name: Upload the test build
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-${{ env.VER }}
          path: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.zip
            dist/*.txt
            dist/SHA256SUMS

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          BookSync Companion $VER and the BookSync KOReader plugin $VER.

          **Install**
          - BookSync Companion: install \`orbit-companion-$VER.apk\`. After that it updates itself from these releases.
          - BookSync KOReader plugin: the companion installs it. By hand: unzip \`orbit.koplugin.zip\` into \`koreader/plugins/\`, delete \`koreader/patches/2-orbit-android.lua\` if present, and restart KOReader. After that it updates itself.

          **Verify**
          - Provenance: \`gh attestation verify <file> -R ${{ github.repository }}\`
          - Checksums: \`sha256sum -c SHA256SUMS\`
          - APK signing certificate SHA-256: \`${{ steps.cert.outputs.sha256 }}\`

          Licenses: the companion is MIT, the BookSync KOReader plugin is AGPL-3.0-or-later; bundled library notices are in \`THIRD-PARTY-NOTICES.txt\`.
          NOTES
          sed -i 's/^          //' notes.md
          FLAGS=()
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease) || FLAGS+=(--latest)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md "${FLAGS[@]}" -R "$GITHUB_REPOSITORY"
          fi
