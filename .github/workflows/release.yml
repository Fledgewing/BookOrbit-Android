# Builds and publishes an Android release: the signed Orbit Companion APK, the version-stamped
# KOReader patch, SHA256SUMS, license and notice files, all with keyless build-provenance
# attestations. Both pieces update themselves from these releases (README "Updates").
#
# Tags: v<version> (AGENTS.md "Releases"); android-v<version> also builds. Firmware releases
# (xteink-v<version>, .github/workflows/xteink.yml) never take "latest": that stays Android.
#
# Test builds (AGENTS.md "Test builds: sideload first, release after"): run it by hand with
# publish off, on any branch. The same signed APK and stamped plugin zip are built as version
# <next patch>-0.test.<run> (tools/android-test-version.sh) and uploaded as the workflow artifact
# android-test-<version>. No tag, no release, no attestation: no updater ever sees a test build.
# tools/sideload-android.sh <run id> installs it over USB.
name: release

on:
  push:
    tags: ["android-v*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.7.1 (ignored for a test build)"
        required: false
        default: ""
      publish:
        description: "Publish a release. Off: a test build of this branch, uploaded only as a workflow artifact"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && format('test-{0}', github.run_id) || (github.event.inputs.tag || github.ref_name) }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # false only for a test build (workflow_dispatch with publish off).
  PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
  # SHA-256 of the release signing certificate. A build signed with anything else fails.
  EXPECTED_CERT_SHA256: "F5:07:8C:85:F8:23:18:30:C1:F1:8D:93:FE:30:D7:1F:87:93:6C:1D:94:24:F2:D8:15:98:3D:1D:21:A9:0A:15"

jobs:
  # The emulated release tests on the release commit (release-tests.yml): the server kit and the
  # companion's JVM tests, Robolectric's install-session states included. Nothing publishes
  # unless they pass.
  tests:
    uses: ./.github/workflows/release-tests.yml
    with:
      platform: android
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release builds its tag; a test build the commit it was started on.
          ref: ${{ env.PUBLISH == 'true' && env.TAG || github.sha }}
          fetch-depth: 0

      - name: Version from the tag
        id: ver
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != true ]; then
            VER="$(git tag -l | tools/android-test-version.sh "$GITHUB_RUN_NUMBER")"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Test build $VER of $GITHUB_REF_NAME $GITHUB_SHA: workflow artifact only, nothing published"
            exit 0
          fi
          VER="${TAG#android-}"
          VER="${VER#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-pre]"; exit 1
          fi
          # A test version is never released: the updaters skip it (TestBuild).
          if [[ "$VER" == *-0.test.* ]]; then
            echo "::error::$TAG is a test-build version; run with publish off instead"; exit 1
          fi
          PRE=false; [[ "$VER" == *-* ]] && PRE=true
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VER (pre-release: $PRE)"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          # Downloads only, as in android.yml: ~/.gradle/caches and the wrapper, restored from
          # main's cache. No Gradle build cache (org.gradle.caching is off) and no project build/
          # directories, so the release still builds from a clean checkout.
          cache: gradle
          cache-dependency-path: |
            android/companion/*.gradle.kts
            android/companion/app/build.gradle.kts
            android/companion/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: KOReader patch tests
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq luajit >/dev/null
          luajit android/koreader/test/test_logic.lua
          luajit android/koreader/test/test_flows.lua

      - name: USB installer checks
        run: |
          set -euo pipefail
          shellcheck -x tools/install-usb.sh tools/test/test-install-usb.sh android/koreader/package.sh \
            tools/android-test-version.sh tools/sideload-android.sh tools/sideload-xteink.sh tools/test/test-sideload.sh
          bash tools/test/test-install-usb.sh
          bash tools/test/test-sideload.sh

      - name: Build the signed companion APK
        working-directory: android/companion
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ORBIT_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ORBIT_KEYSTORE_FILE"
          ./gradlew --no-daemon -PorbitVersion="${{ steps.ver.outputs.version }}" testDebugUnitTest assembleRelease
          rm -f "$ORBIT_KEYSTORE_FILE"

      - name: Assemble release assets
        id: assets
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          APK="dist/orbit-companion-$VER.apk"
          cp android/companion/app/build/outputs/apk/release/app-release.apk "$APK"

          # The Orbit KOReader plugin, zipped with its version stamped into main.lua (the
          # script refuses a stamp that didn't take).
          android/koreader/package.sh "$VER" dist/orbit.koplugin.zip

          # Licenses: the companion (MIT), the plugin (AGPL-3.0-or-later) and the third-party
          # notices the app shows in Settings (generated into the APK at build time).
          cp android/companion/LICENSE dist/LICENSE-companion-MIT.txt
          cp android/koreader/LICENSE dist/LICENSE-koreader-plugin-AGPL-3.0.txt
          unzip -p "$APK" assets/open_source_licenses.txt > dist/THIRD-PARTY-NOTICES.txt
          test -s dist/THIRD-PARTY-NOTICES.txt

          (cd dist && sha256sum -- *.apk *.zip *.txt > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Check the APK signing certificate
        id: cert
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          OUT="$("$APKSIGNER" verify --print-certs dist/orbit-companion-*.apk)"
          echo "$OUT" | grep -i "certificate SHA-256" || true
          GOT="$(echo "$OUT" | sed -nE 's/.*[Cc]ertificate SHA-256 digest: ([0-9a-fA-F]+).*/\1/p' | head -1 | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//')"
          echo "APK signing cert SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate $GOT is not the release certificate $EXPECTED_CERT_SHA256"
            exit 1
          fi
          echo "sha256=$GOT" >> "$GITHUB_OUTPUT"

      - name: Upload the test build
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-test-${{ steps.ver.outputs.version }}
          path: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.zip
            dist/*.txt
            dist/SHA256SUMS

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          cat > notes.md <<NOTES
          Orbit Companion $VER and the Orbit KOReader plugin $VER.

          **Install**
          - Orbit Companion: install \`orbit-companion-$VER.apk\`. After that it updates itself from these releases.
          - Orbit KOReader plugin: the companion installs it. By hand: unzip \`orbit.koplugin.zip\` into \`koreader/plugins/\`, delete \`koreader/patches/2-orbit-android.lua\` if present, and restart KOReader. After that it updates itself.

          **Verify**
          - Provenance: \`gh attestation verify <file> -R ${{ github.repository }}\`
          - Checksums: \`sha256sum -c SHA256SUMS\`
          - APK signing certificate SHA-256: \`${{ steps.cert.outputs.sha256 }}\`

          Licenses: the companion is MIT, the Orbit KOReader plugin is AGPL-3.0-or-later; bundled library notices are in \`THIRD-PARTY-NOTICES.txt\`.
          NOTES
          sed -i 's/^          //' notes.md
          FLAGS=()
          [ "${{ steps.ver.outputs.prerelease }}" = "true" ] && FLAGS+=(--prerelease) || FLAGS+=(--latest)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md "${FLAGS[@]}"
          fi
