name: Xteink
# Builds CrossInk-Bookorbit's latest release with the Tailnet overlay (xteink/) applied.
#
# - push / pull request touching xteink/: host tests and every reader's build of both pinned
#   pinned CrossInk line, crossink-v2.0 in tools/upstreams.lock (no release). Only CrossInk 2.x
#   and later is built: 1.6 is retired (xteink/scripts/upstream-line.sh refuses it).
# - daily schedule and manual runs: move tools/upstreams.lock to upstream's newest 2.x tag (rc
#   included) or the one given (the lock job commits the bump), build the commit the lock records,
#   then publish a release when this (upstream tag, xteink/ tree) pair has not been released yet. A final upstream tag (no -rc/-beta) is published as a stable release, which
#   makes it the feed's stable entry; an rc or beta stays a pre-release (upstream-line.sh channel). Readers see it under
#   Settings > Check for updates: the overlay points their updater at this repo's
#   xteink-v releases (overlay patch ota-tag-prefix).
#
# - test builds (AGENTS.md "Test builds: sideload first, release after"): a manual run with
#   test_build on builds the same firmware as a release would and never publishes. Every build
#   (pull request, push, test build) uploads per reader the artifact firmware-<env>-<asset_version>:
#   the app image, its .sha256 and the partition table it was built for (.parttable, PlatformIO's
#   partitions.bin). tools/sideload-xteink.sh <run id> flashes it over USB. Its fourth number
#   (RUN_BASE + run number) is below every later run's, so a reader on a test build takes the
#   next release over the air.
#
# Trust: the build jobs run upstream's PlatformIO scripts, so they get a read-only token, no
# stored credentials and no secrets. Only the lock, publish and feed jobs can write, and none of
# them checks out or runs upstream code: publish downloads the built files, checks them and
# releases them. Every action is pinned by commit (tools/test/test-workflows.py).
#
# Tags: xteink-v<version>. Firmware releases are published with make_latest=false: "latest"
# is always an Android release (companions up to 0.6.x read releases/latest).
#
# Readers find firmware through a feed, not GitHub's release list: GitHub orders that list by
# version-like tag name, so prefixed xteink-v tags sort after every v<version> Android release
# and fall off any page a reader could read. After each release the feed job writes the newest
# stable and the newest pre-release firmware release to xteink/releases.json on the
# xteink-feed branch, in GitHub's release format; the firmware reads it from
# raw.githubusercontent.com (xteink/tailnet/tailnet_build.py OTA_FEED).
#
# Release versions keep upstream's and add a fourth number that only ever goes up
# (RUN_BASE + the workflow run number): upstream v2.0.0+bookorbit.1-rc3 becomes
# xteink-v2.0.0.<n>+bookorbit.1-rc3. CrossInk's updater compares four numeric parts, so a new
# upstream release or an overlay-only rebuild both read as newer. RUN_BASE keeps the numbers
# above the last CrossInk-Tailnet releases (1.6.1.52, 2.0.0.51) now that the run counter restarted.
on:
  push:
    branches: [main]
    paths: ["xteink/**", "shared/**", "tools/upstreams.lock", "tools/booksync-version.py", "tools/releases/**", "tools/xteink-feed.py", ".github/workflows/xteink.yml", ".github/actions/pio-setup/**"]
  pull_request:
    paths: ["xteink/**", "shared/**", "tools/upstreams.lock", "tools/booksync-version.py", "tools/releases/**", "tools/xteink-feed.py", ".github/workflows/xteink.yml", ".github/actions/pio-setup/**"]
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "CrossInk-Bookorbit tag to pin in tools/upstreams.lock and build (empty = upstream's newest 2.x tag)"
        required: false
        type: string
      patch_series:
        description: "Overlay patch series (v2.0; empty = from the upstream version)"
        required: false
        type: string
      force_release:
        description: "Publish even if this upstream tag + overlay commit was already released"
        required: false
        type: boolean
        default: false
      feed_only:
        description: "Only rewrite the firmware feed from the published releases (no build)"
        required: false
        type: boolean
        default: false
      test_build:
        description: "Test build: firmware artifacts only, never a release (tools/sideload-xteink.sh)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: agosez/CrossInk-Bookorbit
  PIO_CORE: "6.1.19"
  RUN_BASE: "100"
  FEED_BRANCH: xteink-feed
  FEED_PATH: xteink/releases.json

jobs:
  # Which upstream commit this run builds, always as recorded in tools/upstreams.lock. Push and
  # pull request builds take the lock as it is, so an upstream release never turns an unrelated
  # change red. Daily and manual runs first move the lock to one tag: upstream's newest 2.x
  # release, rc included, unless one is given (a patch that stops applying shows up there);
  # upstream's "latest" skips pre-releases. The tag is resolved to its commit here, through the
  # API, and the bump is committed to this branch, so the release builds a commit, not a tag that
  # could move. Runs no upstream code; the only job besides publish and feed that can write.
  lock:
    if: ${{ !inputs.feed_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.l.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            xteink/scripts
            tools
            shared

      - id: l
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          TEST_BUILD: ${{ inputs.test_build }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Unified releases build the exact Android release commit and its pinned base.
          if [ "$(python3 tools/booksync-version.py unified)" = true ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pushes, pull requests and test builds without upstream_ref build the lock as it is. A
          # test build of another upstream tag pins it on its own branch, never on main.
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = pull_request ] \
            || { [ "${TEST_BUILD:-false}" = true ] && [ -z "$INPUT_REF" ]; }; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_REF" ]; then
            tag="$INPUT_REF"
          else
            tag="$(gh api "repos/$UPSTREAM_REPO/releases?per_page=50" -q '.[] | select(.draft | not) | .tag_name' \
              | xteink/scripts/upstream-line.sh pick)"
          fi
          xteink/scripts/upstream-line.sh channel "$tag" >/dev/null  # refuses a 1.x tag
          commit="$(gh api "repos/$UPSTREAM_REPO/commits/$(printf '%s' "$tag" | sed 's/+/%2B/g')" -q .sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit for upstream tag $tag"; exit 1; }
          read -r _ repo ref pinned < <(awk '$1 == "crossink-v2.0"' tools/upstreams.lock)
          if [ "$ref" = "$tag" ] && [ "$pinned" = "$commit" ]; then
            echo "tools/upstreams.lock already pins $tag ($commit)"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${TEST_BUILD:-false}" = true ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "::error::a test build never moves $DEFAULT_BRANCH's pin; run it on a branch"
            exit 1
          fi
          # tools/upstreams pin's format, committed through the API on top of this branch.
          awk -v r="$tag" -v s="$commit" \
            '$1 == "crossink-v2.0" && $0 !~ /^#/ {printf "%-17s %-28s %-23s %s\n", $1, $2, r, s; next} {print}' \
            tools/upstreams.lock > "$RUNNER_TEMP/upstreams.lock"
          blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/tools/upstreams.lock?ref=$GITHUB_REF_NAME" -q .sha)"
          sha="$(gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/tools/upstreams.lock" \
            -f message="Pin CrossInk-Bookorbit $tag (${commit:0:12}) for the Xteink release build" \
            -f branch="$GITHUB_REF_NAME" -f sha="$blob" -f content="$(base64 -w0 "$RUNNER_TEMP/upstreams.lock")" \
            -q .commit.sha)"
          echo "tools/upstreams.lock: $repo $ref ($pinned) -> $tag ($commit) in $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  resolve:
    needs: lock
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.lock.outputs.sha }}
      upstream_tag: ${{ steps.r.outputs.upstream_tag }}
      upstream_commit: ${{ steps.r.outputs.upstream_commit }}
      marker: ${{ steps.r.outputs.marker }}
      version: ${{ steps.r.outputs.version }}
      asset_version: ${{ steps.r.outputs.asset_version }}
      publish: ${{ steps.r.outputs.publish }}
      prerelease: ${{ steps.r.outputs.prerelease }}
      lines: ${{ steps.r.outputs.lines }}
      matrix: ${{ steps.plan.outputs.matrix }}
      firmware_build: ${{ steps.plan.outputs.firmware_build }}
      firmware_release_tests: ${{ steps.plan.outputs.firmware_release_tests }}
      profiles: ${{ steps.plan.outputs.profiles }}
      archive_env: ${{ steps.plan.outputs.archive_env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.lock.outputs.sha }}
          persist-credentials: false

      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_release }}
          TEST_BUILD: ${{ inputs.test_build }}
        run: |
          set -euo pipefail
          read -r _ _ tag commit < <(awk '$1 == "crossink-v2.0"' tools/upstreams.lock)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tools/upstreams.lock has no crossink-v2.0 commit"; exit 1; }
          # Refuses a 1.x tag; stable for a final release, prerelease for an rc or beta.
          channel="$(xteink/scripts/upstream-line.sh channel "$tag")"
          # 2.0.0+bookorbit.1-rc3 -> 2.0.0.<run>+bookorbit.1-rc3
          base="${tag#v}"
          numeric="$(printf '%s' "$base" | sed -E 's/^([0-9]+(\.[0-9]+)*).*/\1/')"
          version="${numeric}.$((RUN_BASE + GITHUB_RUN_NUMBER))${base#"$numeric"}"
          if [ "$(python3 tools/booksync-version.py unified)" = true ]; then
            test_args=()
            [ "${TEST_BUILD:-false}" = true ] && test_args+=(test)
            version="$(python3 tools/booksync-version.py firmware "$tag" "$GITHUB_RUN_NUMBER" "${test_args[@]}")"
            channel="$(python3 tools/booksync-version.py channel)"
          fi
          asset_version="$(printf '%s' "$version" | sed 's/[^A-Za-z0-9._-]\{1,\}/-/g')"
          lines="$(jq -cn --arg tag "$tag" --arg commit "$commit" --arg version "$version" --arg asset "$asset_version" \
            '[{upstream_tag: $tag, upstream_commit: $commit, version: $version, asset_version: $asset}]')"

          # Only xteink/ decides: an Android-only commit never makes a firmware release. Releases are
          # batched (README "When a release is made"): the daily run publishes only for a new upstream
          # tag; our own changes go out by a manual run. The rule: upstream-line.sh publish.
          marker="upstream=$tag overlay-tree=$(git rev-parse HEAD:xteink)"
          publish=false
          # A test build never publishes (the publish and e2e jobs check test_build too).
          if [ "${TEST_BUILD:-false}" = true ]; then
            echo "Test build: firmware artifacts only, nothing published"
          elif [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            publish="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[].body' \
              | xteink/scripts/upstream-line.sh publish "$GITHUB_EVENT_NAME" "$tag" "$marker" "${FORCE:-false}")"
          fi
          if [ "$(python3 tools/booksync-version.py unified)" = true ]; then
            # Only a run dispatched at the matching Android tag publishes unified firmware.
            # The tag is immutable and all three products read its manifest.
            book="$(python3 tools/booksync-version.py version)"
            publish=false
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${TEST_BUILD:-false}" != true ] &&
               { [ "$GITHUB_REF_NAME" = "v$book" ] || [ "$GITHUB_REF_NAME" = "android-v$book" ]; }; then
              publish=true
            fi
          fi
          {
            echo "upstream_tag=$tag"
            echo "upstream_commit=$commit"
            echo "marker=$marker"
            echo "version=$version"
            echo "asset_version=$asset_version"
            echo "publish=$publish"
            echo "prerelease=$([ "$channel" = prerelease ] && echo true || echo false)"
            echo "lines=$lines"
          } >> "$GITHUB_OUTPUT"
          echo "upstream $tag ($commit) -> $version (publish=$publish, $channel)"

      - name: Plan each reader from source inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.r.outputs.publish }}
          LINES: ${{ steps.r.outputs.lines }}
        run: |
          set -euo pipefail
          force=()
          if [ "$PUBLISH" != true ] || [ "$(python3 tools/booksync-version.py unified)" != true ]; then
            force+=(--force)
            echo '{}' > "$RUNNER_TEMP/history.json"
          else
            python3 tools/releases/inputs.py collect > "$RUNNER_TEMP/history.json"
          fi
          python3 tools/releases/inputs.py plan --version "$(python3 tools/booksync-version.py version)" \
            --history "$RUNNER_TEMP/history.json" "${force[@]}" > release-plan.json
          if [ "$PUBLISH" = true ] && [ "$(python3 tools/booksync-version.py unified)" = true ]; then
            python3 tools/releases/inputs.py require-android --plan release-plan.json
          fi
          python3 tools/releases/inputs.py outputs --plan release-plan.json >> "$GITHUB_OUTPUT"
          matrix="$(python3 tools/releases/inputs.py matrix --plan release-plan.json | jq -c --argjson lines "$LINES" 'map(. + {line: $lines[0]})')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "archive_env=$(jq -r '.[0].environment // empty' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          python3 tools/releases/inputs.py notes --plan release-plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-plan
          path: release-plan.json
          if-no-files-found: error

  # Runs upstream's build scripts: read-only token, no credentials left in either checkout, no
  # secrets and no token in the environment.
  build:
    name: build ${{ matrix.line.upstream_tag }} ${{ matrix.environment }}
    needs: resolve
    if: needs.resolve.outputs.firmware_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Check out Orbify
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: orbify
          submodules: recursive
          persist-credentials: false

      - name: Check out CrossInk-Bookorbit ${{ matrix.line.upstream_tag }} at the locked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.line.upstream_commit }}
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: The checkout is the locked commit
        env:
          WANT: ${{ matrix.line.upstream_commit }}
        run: test "$(git -C upstream rev-parse HEAD)" = "$WANT"

      - uses: ./orbify/.github/actions/pio-setup
        with:
          pio-core: ${{ env.PIO_CORE }}
          platformio-ini: upstream/platformio.ini

      - name: Pin pioarduino core inside the platform penv
        working-directory: upstream
        run: |
          set -euo pipefail
          pio pkg install -e "${{ matrix.environment }}" </dev/null
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==${PIO_CORE}"

      - name: Apply the overlay
        # overlay/patches/v2.0 for CrossInk 2.x (picked from the checkout's version).
        env:
          CROSSINK_PATCH_SERIES: ${{ inputs.patch_series }}
        run: orbify/xteink/scripts/apply.sh upstream

      - name: Set the release version
        working-directory: upstream
        env:
          VERSION: ${{ matrix.line.version }}
        run: sed -i "/^\[crossink\]$/,/^\[/s/^version = .*/version = $VERSION/" platformio.ini

      - name: Build
        working-directory: upstream
        env:
          BOOKSYNC_TEST_RUN: ${{ inputs.test_build && github.run_number || '' }}
          CROSSINK_RELEASE_VERSION: ${{ matrix.line.version }}
          TAILNET_OVERLAY_REPO: ${{ github.repository }}
          TAILNET_OTA_TAG_PREFIX: xteink-v
        run: |
          set -o pipefail
          pio run -j1 -e "${{ matrix.environment }}" </dev/null 2>&1 | tee ../build.log

      # The app slot is fixed (the partition table changes only over USB), and the X3 build was
      # at 98.5% before the Orbify features: a build above 99.5% fails here, and the features drop
      # in the order docs/design/end-of-book/DESIGN.md §5 gives (suggestions first, then the author row).
      - name: Flash budget (99.5% of the app slot)
        run: |
          set -euo pipefail
          line="$(grep -a 'Flash: \[' build.log | tail -1)"
          used="$(printf '%s' "$line" | sed -E 's/.*used ([0-9]+) bytes from ([0-9]+) bytes.*/\1/')"
          slot="$(printf '%s' "$line" | sed -E 's/.*used ([0-9]+) bytes from ([0-9]+) bytes.*/\2/')"
          pct="$(awk -v u="$used" -v s="$slot" 'BEGIN { printf "%.2f", 100 * u / s }')"
          echo "${{ matrix.line.upstream_tag }} ${{ matrix.environment }}: $used of $slot bytes ($pct%), $((slot * 995 / 1000 - used)) bytes under the 99.5% gate" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$((used * 1000))" -le "$((slot * 995))" ] || { echo "::error::${{ matrix.environment }} uses $pct% of the app slot (gate 99.5%)"; exit 1; }

      # After the build: Orbify's tests compile against the ArduinoJson the build fetched.
      - name: Host tests
        if: matrix.component_tests
        env:
          ORBIFY_REQUIRE_RENDER: "1"
          ORBIFY_TEST_OUT: ${{ runner.temp }}/orbify-host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfreetype-dev libpng-dev pkg-config
          orbify/xteink/test/run-host-tests.sh upstream

      # The End-of-Book page as the host test drew it (X4 Pro online, offline, not finished; X4).
      - name: End-of-Book page images
        if: matrix.environment == 'x4-pro' && matrix.component_tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eob-page-${{ matrix.line.asset_version }}
          path: ${{ runner.temp }}/orbify-host/eob-*.png
          if-no-files-found: error

      # Complete corresponding source (GPL): the overlay with MicroLink, CrossInk after the
      # overlay, the FreeInk SDK, every env's library sources and the Arduino core. Packed once,
      # by one leg, only for a release; nothing extra is built.
      - name: Pack the source archive
        if: matrix.environment == needs.resolve.outputs.archive_env && needs.resolve.outputs.publish == 'true'
        working-directory: upstream
        run: |
          set -euo pipefail
          pio pkg install -e default -e x4-classic -e x4-pro </dev/null
          ../orbify/xteink/scripts/source-archive.sh --upstream . \
            --version "${{ needs.resolve.outputs.version }}" \
            --core ~/.platformio/packages/framework-arduinoespressif32 \
            --out "../source/source-${{ needs.resolve.outputs.asset_version }}.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.environment == needs.resolve.outputs.archive_env && needs.resolve.outputs.publish == 'true'
        with:
          name: source-archive
          path: source/*.tar.gz
          if-no-files-found: error
          compression-level: 0

      # For tools/sideload-xteink.sh: the image's SHA-256 and the partition table the build used.
      # Neither name ends in .bin, so the publish job's *.bin never picks them up.
      # The ELF (gzipped: ~170 MB raw, mostly DWARF), named per reader, decodes a core dump read off
      # a reader exactly: esp-coredump checks the dump's app SHA against it, and a rebuild elsewhere
      # differs in its embedded paths. gunzip it, then `esp-coredump info_corefile -c <dump> <elf>`.
      - name: Checksum, partition table and ELF beside the image
        working-directory: upstream/.pio/build/${{ matrix.environment }}
        run: |
          set -euo pipefail
          bin="${{ matrix.firmware }}-v${{ matrix.line.asset_version }}.bin"
          # The stamp must be present in the newly built image even when tests were reused.
          stamp='${{ matrix.line.version }}'
          strings "$bin" | grep -F -- "${stamp//+/-}" > /dev/null
          sha256sum -- "$bin" > "$bin.sha256"
          cp partitions.bin "${bin%.bin}.parttable"
          gzip -6 -c firmware.elf > "${bin%.bin}.elf.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.environment }}-${{ matrix.line.asset_version }}
          path: |
            upstream/.pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ matrix.line.asset_version }}.bin
            upstream/.pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ matrix.line.asset_version }}.bin.sha256
            upstream/.pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ matrix.line.asset_version }}.parttable
            upstream/.pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ matrix.line.asset_version }}.elf.gz
          if-no-files-found: error

      - name: Record passing component inputs
        working-directory: orbify
        run: python3 tools/releases/inputs.py receipt --platforms '${{ matrix.environment }}' > passed-inputs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passed-inputs-${{ matrix.environment }}
          path: orbify/passed-inputs.json
          if-no-files-found: error
          retention-days: 90

  # The emulated release tests (release-tests.yml) on the commit and CrossInk commit about to be
  # published: only when this run publishes (upstream-line.sh decides), so pushes and the daily
  # run with nothing new stay as they were. The release waits for them.
  e2e:
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true' && !inputs.test_build && needs.resolve.outputs.firmware_release_tests == 'true'
    uses: ./.github/workflows/release-tests.yml
    with:
      platform: xteink
      ref: ${{ needs.resolve.outputs.sha }}
      upstream_ref: ${{ needs.resolve.outputs.upstream_commit }}
      profiles: ${{ needs.resolve.outputs.profiles }}

  # Never checks out or runs upstream code: it downloads the build jobs' files, checks them
  # against what the run should have produced and publishes them. The only job with id-token.
  publish:
    needs: [resolve, build, e2e]
    if: ${{ always() && needs.resolve.outputs.publish == 'true' && !inputs.test_build && needs.build.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: source-archive
          path: firmware

      # Orbify's own files at the built commit: the license list, texts and the notes section.
      - name: Check out Orbify
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: orbify
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: firmware-plan

      - name: Check the built files
        working-directory: firmware
        env:
          ASSET_VERSION: ${{ needs.resolve.outputs.asset_version }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
        run: |
          set -euo pipefail
          # Exactly one image per reader, each matching the checksum its build wrote beside it.
          for fw in $(jq -r '.[].firmware' <<< "$MATRIX"); do
            bin="$fw-v$ASSET_VERSION.bin"
            test -s "$bin" || { echo "::error::missing $bin"; exit 1; }
            sha256sum -c "$bin.sha256"
            test -s "${bin%.bin}.elf.gz" && test -s "${bin%.bin}.parttable"
          done
          test "$(find . -maxdepth 1 -name '*.bin' | wc -l)" -eq "$(jq length <<< "$MATRIX")"
          test "$(find . -maxdepth 1 -name 'source-*.tar.gz' | wc -l)" -eq 1
          # Anything else is not ours to publish.
          extra="$(find . -maxdepth 1 -type f ! -name 'firmware-*' ! -name 'source-*.tar.gz' | sort)"
          [ -z "$extra" ] || { echo "::error::unexpected files: $extra"; exit 1; }

      # The release key signs each image (docs/design/release-signing.md); readers check it after
      # the SHA-256. The key is in this step's environment only. Without it the release goes out
      # unsigned, unless shared/release-signing.json enforces signatures.
      - name: Sign the images
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: xteink-v${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if jq -e '.enforce' orbify/shared/release-signing.json >/dev/null; then
              echo "::error::signatures are enforced but the secret RELEASE_SIGNING_KEY is not set"; exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set: this release is unsigned"
            exit 0
          fi
          orbify/tools/feed-keys/feed-keys sign --tag "$TAG" firmware/*.bin > firmware/SIGNATURES
          # The same check the readers make, against the committed root, before anything is published.
          if [ -n "$(jq -r .root_public_key orbify/shared/release-signing.json)" ]; then
            orbify/tools/feed-keys/feed-keys verify --tag "$TAG" firmware/SIGNATURES firmware/*.bin
          fi

      - name: Write the release notes and license files
        env:
          GH_TOKEN: ${{ github.token }}
          OVERLAY_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.upstream_tag }}
          MARKER: ${{ needs.resolve.outputs.marker }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          python3 orbify/tools/releases/inputs.py published --plan release-plan.json --platforms x4-pro,x4-classic,default \
            --tag 'xteink-v${{ needs.resolve.outputs.version }}' > firmware/FIRMWARE-INPUTS.json
          cp orbify/xteink/THIRD_PARTY_LICENSES.md firmware/
          (cd orbify/xteink && zip -qr ../../firmware/licenses.zip licenses LICENSE THIRD_PARTY_LICENSES.md)
          (cd firmware && sha256sum -- *.bin *.elf.gz *.tar.gz THIRD_PARTY_LICENSES.md licenses.zip FIRMWARE-INPUTS.json > SHA256SUMS)
          {
            echo "CrossInk-Bookorbit $TAG with Tailscale (MicroLink): Orbify's Xteink firmware."
            echo
            echo "Install over the air from the reader (Settings > Check for updates) once it runs a"
            echo "CrossInk-Tailnet or Orbify build, or flash the .bin for your reader from an SD card or USB."
            echo "Verify: \`sha256sum -c SHA256SUMS\`, \`gh attestation verify <file> -R $OVERLAY_REPO\`."
            echo 'The X3 build leaves out Nearby transfer, mDNS, Plugins and language/hyphenation downloads (see "X3 (v2.0) differences" in the README for workarounds). The X4 Pro and X4 Classic keep everything.'
            echo
            orbify/xteink/scripts/licenses-section.sh "$TAG" "$SHA"
            echo
            # Marker the resolve job looks for to skip already-released pairs.
            echo "$MARKER"
            echo "booksync_version=$(python3 orbify/tools/booksync-version.py version)"
            if [ "$(python3 orbify/tools/booksync-version.py unified)" = false ]; then
              echo "OTA bridge: install this build before BookSync 0.12."
            fi
          } > notes.md
          python3 orbify/tools/releases/inputs.py notes --plan release-plan.json >> notes.md
          cat notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            firmware/*.bin
            firmware/*.elf.gz
            firmware/source-*.tar.gz
            firmware/THIRD_PARTY_LICENSES.md
            firmware/licenses.zip
            firmware/SHA256SUMS
            firmware/FIRMWARE-INPUTS.json

      # "latest" stays an Android release (AGENTS.md "Releases"). An upstream rc or beta stays a
      # pre-release here too: only readers with Include pre-releases on are offered it. A
      # final upstream release is stable, and the feed job makes it the stable entry
      # (xteink/scripts/upstream-line.sh channel).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: xteink-v${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--latest=false)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          files=(firmware/*.bin firmware/*.elf.gz firmware/THIRD_PARTY_LICENSES.md firmware/licenses.zip
            firmware/source-*.tar.gz firmware/SHA256SUMS firmware/FIRMWARE-INPUTS.json)
          [ -f firmware/SIGNATURES ] && files+=(firmware/SIGNATURES)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --notes-file notes.md "${flags[@]}" \
            "${files[@]}"

      - name: Refresh Android's platform table after firmware publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(python3 orbify/tools/booksync-version.py unified)" != true ]; then exit 0; fi
          # Firmware-only previews have no empty Android release to edit.
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/android-notes.md"; then
            python3 orbify/tools/releases/inputs.py refresh-notes --plan release-plan.json \
              --notes "$RUNNER_TEMP/android-notes.md" > "$RUNNER_TEMP/current-notes.md"
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/current-notes.md"
          fi

  # The readers' update feed: the newest stable and the newest pre-release xteink-v release,
  # reduced to what the updater reads (tag, pre-release flag, assets with size and digest).
  feed:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.feed_only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Orbify's signing tool only (no upstream code).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            shared

      - name: Write the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' \
            | python3 tools/xteink-feed.py > "$RUNNER_TEMP/unsigned.json"
          # Each image's signature from its release's SIGNATURES, as "orbify_signature" (what the
          # readers check; docs/design/release-signing.md). Releases from before signing have none.
          echo '{}' > "$RUNNER_TEMP/signatures.json"
          while IFS= read -r tag; do
            rm -f "$RUNNER_TEMP/SIGNATURES"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SIGNATURES -O "$RUNNER_TEMP/SIGNATURES" 2>/dev/null || continue
            while IFS= read -r name; do
              field="$(tools/feed-keys/feed-keys feed-field "$RUNNER_TEMP/SIGNATURES" "$name")" || continue
              jq --arg t "$tag" --arg n "$name" --arg f "$field" '.[$t][$n] = $f' "$RUNNER_TEMP/signatures.json" > "$RUNNER_TEMP/s.json"
              mv "$RUNNER_TEMP/s.json" "$RUNNER_TEMP/signatures.json"
            done < <(jq -r --arg t "$tag" '.[] | select(.tag_name == $t) | .assets[].name' "$RUNNER_TEMP/unsigned.json")
            echo "$tag: $(jq --arg t "$tag" '.[$t] // {} | length' "$RUNNER_TEMP/signatures.json") signed assets"
          done < <(jq -r '.[].tag_name' "$RUNNER_TEMP/unsigned.json")
          jq --slurpfile m "$RUNNER_TEMP/signatures.json" '
            map(.tag_name as $t | .assets |= map(
              ($m[0][$t][.name] // null) as $s | if $s then . + {orbify_signature: $s} else . end))' \
            "$RUNNER_TEMP/unsigned.json" > releases.json
          jq -r '.[] | "\(.tag_name) (pre-release: \(.prerelease))"' releases.json
          test "$(jq length releases.json)" -ge 1

      # The feed file itself, signed like a release asset (tag xteink-feed).
      - name: Sign the feed
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if jq -e '.enforce' shared/release-signing.json >/dev/null; then
              echo "::error::signatures are enforced but the secret RELEASE_SIGNING_KEY is not set"; exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set: the feed is unsigned"
            exit 0
          fi
          tools/feed-keys/feed-keys sign --tag xteink-feed releases.json > releases.json.sig
          if [ -n "$(jq -r .root_public_key shared/release-signing.json)" ]; then
            tools/feed-keys/feed-keys verify --tag xteink-feed releases.json.sig releases.json
          fi

      - name: Write the feed to the feed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/$FEED_BRANCH" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$FEED_BRANCH" -f sha="$GITHUB_SHA" >/dev/null
          fi
          put() { # local file, path on the feed branch
            local old_sha args
            old_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$2?ref=$FEED_BRANCH" -q .sha 2>/dev/null || true)"
            args=(-X PUT "repos/$GITHUB_REPOSITORY/contents/$2"
              -f message="xteink feed: $(jq -r 'map(.tag_name) | join(", ")' releases.json)"
              -f branch="$FEED_BRANCH" -f content="$(base64 -w0 "$1")")
            [ -n "$old_sha" ] && args+=(-f sha="$old_sha")
            gh api "${args[@]}" -q .content.path
          }
          put releases.json "$FEED_PATH"
          if [ -f releases.json.sig ]; then put releases.json.sig "$FEED_PATH.sig"; fi
