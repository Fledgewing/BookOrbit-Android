# The emulated release tests (docs/design/emulated-release-tests.md): what a release must pass
# before it is published, with no device. Called by release.yml (Android) and xteink.yml
# (firmware) on the release commit; also run by hand.
#
#   stage 0  server kit: the fault proxy's tests, then the real BookOrbit (pinned by digest,
#            tools/e2e/compose.yml) seeded with the synthetic library, checked through the proxy
#   stage 1  Xteink: BookSync's overlay in upstream's SDL simulator, one job per reader, the
#            scenarios in xteink/test/e2e/run.py against the stage-0 server
#   stage 2  Android: the companion's JVM tests, Robolectric included (install-session states)
#
# Locally: AGENTS.md "Emulated release tests".
name: release-tests

on:
  push:
    branches: [main]
    paths: ["android/koreader/**", ".github/workflows/release-tests.yml", ".github/workflows/release.yml"]
  pull_request:
    paths:
      - "android/koreader/**"
      - ".github/workflows/release.yml"
      - "tools/e2e/**"
      - "shared/fixtures/e2e/**"
      - "xteink/test/e2e/**"
      - "xteink/tailnet/sim/**"
      - "xteink/overlay/patches/v2.0/0090-orbify-simulator-build.patch"
      - "xteink/overlay/patches/v2.0/0056-booksync-update-channels.patch"
      - ".github/workflows/release-tests.yml"
      - ".github/actions/pio-setup/**"
      - ".github/actions/android-setup/**"
  workflow_call:
    inputs:
      platform:
        description: "android, xteink or all"
        type: string
        default: all
      ref:
        description: "BookSync commit to test (default: the caller's)"
        type: string
        default: ""
      upstream_ref:
        description: "CrossInk tag or commit for stage 1 (default: tools/upstreams.lock's commit)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      platform:
        description: "android, xteink or all"
        type: choice
        options: [all, xteink, android]
        default: all
      ref:
        description: "BookSync commit to test (default: this run's)"
        type: string
        default: ""
      upstream_ref:
        description: "CrossInk tag or commit for stage 1 (default: tools/upstreams.lock)"
        type: string
        default: ""

permissions:
  contents: read

env:
  UPSTREAM_REPO: agosez/CrossInk-Bookorbit
  PIO_CORE: "6.1.19"

jobs:
  kit:
    name: stage 0 server kit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Fault proxy and library tests
        run: python3 tools/e2e/test_kit.py </dev/null

      - name: BookOrbit up and seeded
        run: python3 tools/e2e/kit.py up </dev/null

      - name: The seeded server through the proxy
        env:
          ORBIFY_E2E_LIVE: "1"
        run: python3 tools/e2e/test_kit.py </dev/null

      - name: Server logs
        if: failure()
        run: docker compose --env-file tools/e2e/e2e.env -f tools/e2e/compose.yml logs --no-color | tail -200

  xteink:
    name: stage 1 ${{ matrix.profile }} simulator
    if: (inputs.platform || 'all') != 'android'
    needs: kit
    runs-on: ubuntu-24.04
    # X4 Pro completes 40 passing scenarios near 40 minutes including its build.
    # Leave room for artifact upload/cleanup; scenario deadlines remain in run.py.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [x4-pro, x4-classic, x3]
        include:
          - profile: x4-pro
            env: x4-pro-simulator
          - profile: x4-classic
            env: x4-classic-simulator
          - profile: x3
            env: simulator-X3
    steps:
      - name: Check out BookSync
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: orbify
          submodules: recursive
          persist-credentials: false

      - name: CrossInk version
        id: up
        env:
          INPUT_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$(awk '$1 == "crossink-v2.0" {print $4}' orbify/tools/upstreams.lock)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out CrossInk-Bookorbit ${{ steps.up.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.up.outputs.ref }}
          path: upstream
          submodules: recursive
          persist-credentials: false

      - uses: ./orbify/.github/actions/pio-setup
        with:
          pio-core: ${{ env.PIO_CORE }}
          platformio-ini: upstream/platformio.ini
          cache-prefix: pio-sim
          extra-apt: libsdl2-dev libssl-dev libwolfssl-dev pkg-config

      - name: Apply the overlay
        run: orbify/xteink/scripts/apply.sh upstream

      - name: Build the ${{ matrix.profile }} simulator
        working-directory: upstream
        run: pio run -e "${{ matrix.env }}" </dev/null

      - name: BookOrbit up and seeded
        run: python3 orbify/tools/e2e/kit.py up </dev/null

      - name: Scenarios
        run: |
          python3 orbify/xteink/test/e2e/run.py --checkout upstream --profile "${{ matrix.profile }}" \
            --out "$RUNNER_TEMP/e2e" </dev/null

      - name: Results
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/e2e/results-${{ matrix.profile }}.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF' || true
          import json, sys
          rows = json.load(open(sys.argv[1]))
          print("| scenario | result | seconds |\n|---|---|---|")
          for r in rows:
              print(f"| {r['scenario']} | {r['verdict']} | {r['seconds']} |")
          EOF

      - name: Logs, screenshots and the proxy's request log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.profile }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: warn

  reader-startup:
    name: KOReader start into last book and open from Home/history
    if: (inputs.platform || 'all') != 'xteink'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # No prebuilt headless CRE engine is available in the source checkout. Exercise
      # ReaderReady -> show(reader) with a yielding GET and the real pinned Trapper.
      - name: Fetch pinned KOReader
        run: |
          set -euo pipefail
          sha=$(awk '$1 == "koreader" {print $4}' tools/upstreams.lock)
          git init -q "$RUNNER_TEMP/koreader"
          git -C "$RUNNER_TEMP/koreader" remote add origin https://github.com/koreader/koreader
          git -C "$RUNNER_TEMP/koreader" fetch -q --depth 1 origin "$sha"
          git -C "$RUNNER_TEMP/koreader" checkout -q --detach FETCH_HEAD

      - name: Open last book, Home, history and file browser without exiting
        env:
          ORBIT_KOREADER_SOURCE: ${{ runner.temp }}/koreader
          ORBIT_TEST_ONLY: startup
          ORBIT_REQUIRE_READER_FLOWS: "1"
        run: |
          sudo apt-get install -y -qq luajit libsqlite3-0 >/dev/null
          # Older tags must not ignore the required-scenario flag during a manual rebuild.
          grep -q ORBIT_REQUIRE_READER_FLOWS android/koreader/test/test_flows.lua
          luajit android/koreader/test/test_flows.lua </dev/null

  android:
    name: stage 2 companion JVM tests
    if: (inputs.platform || 'all') != 'xteink'
    needs: kit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # The same Java, Gradle cache (setup-gradle) and SDK as android.yml and release.yml.
      - uses: ./.github/actions/android-setup

      - name: Companion unit and Robolectric tests
        working-directory: android/companion
        run: ./gradlew --no-daemon testDebugUnitTest </dev/null

  reader-required:
    name: Required KOReader release gate
    needs: reader-startup
    if: ${{ always() && (inputs.platform || 'all') != 'xteink' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reader flows must have run successfully
        env:
          READER_RESULT: ${{ needs.reader-startup.result }}
        run: test "$READER_RESULT" = success
