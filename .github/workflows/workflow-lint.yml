# Lints .github/: actionlint (with shellcheck over every run: script) and the supply-chain
# rules in tools/test/test-workflows.py (actions pinned by SHA, no stored credentials, no
# write permission, secret or token in a job that runs a build tool).
name: Workflow lint

on:
  push:
    branches: [main]
    paths: [".github/**", "tools/test/test-rename-bridge.py", "tools/rename*", "tools/test/test-workflows.py"]
  pull_request:
    paths: [".github/**", "tools/test/test-rename-bridge.py", "tools/rename*", "tools/test/test-workflows.py"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" # linux_amd64

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Supply-chain rules
        run: |
          python3 tools/test/test-workflows.py </dev/null
          python3 tools/test/test-rename-bridge.py </dev/null

      - name: actionlint
        run: |
          set -euo pipefail
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color </dev/null
