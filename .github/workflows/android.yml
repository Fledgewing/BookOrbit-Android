# Android CI: the KOReader plugin tests, the USB installer checks and the companion's unit
# tests, debug build and lint. Releases build in release.yml (android-v* tags).
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", "tools/**", ".github/workflows/android.yml", ".github/actions/**"]
  pull_request:
    paths: ["android/**", "shared/**", "tools/**", ".github/workflows/android.yml", ".github/actions/**"]
  workflow_dispatch:
  # Keeps main's Gradle cache entry fresh: entries unused for 7 days are evicted.
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shared BookSync versions
        run: python3 tools/test/test-booksync-version.py

      # Java, setup-gradle and the SDK (.github/actions/android-setup). PRs write the Gradle cache
      # too (into their own scope, which only that PR restores), so a PR that adds a dependency
      # downloads it once, not on every push.
      - uses: ./.github/actions/android-setup
        with:
          cache-read-only: "false"

      # The same plugin tests and zip checks release.yml runs (.github/actions/plugin-tests).
      - uses: ./.github/actions/plugin-tests
        timeout-minutes: 5

      - uses: ./.github/actions/script-checks

      - name: Companion tests, debug build and lint
        working-directory: android/companion
        run: ./gradlew --no-daemon verifySharedVersion testDebugUnitTest assembleDebug lintDebug </dev/null

      # The pages as Robolectric draws them (PageLayoutTest), at the M8C's size and a phone's.
      - name: Page screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-screenshots
          path: android/companion/app/build/screenshots/
          if-no-files-found: ignore
