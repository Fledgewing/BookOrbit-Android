# Android CI: the KOReader plugin tests, the USB installer checks and the companion's unit
# tests, debug build and lint. Releases build in release.yml (android-v* tags).
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", "tools/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", "tools/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          # Robolectric's Android jars (350 MB) from Maven Central, which answers shared runners
          # with 429 Too Many Requests: downloaded once per build-file change, then cached.
          cache: gradle
          cache-dependency-path: |
            android/companion/*.gradle.kts
            android/companion/app/build.gradle.kts
            android/companion/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: KOReader plugin tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq luajit >/dev/null
          # stdin closed: nothing in the tests may wait on a terminal.
          luajit android/koreader/test/test_logic.lua </dev/null
          luajit android/koreader/test/test_flows.lua </dev/null
          # The release zip builds, stamped, with everything under orbit.koplugin/.
          android/koreader/package.sh 0.0.0-ci "$RUNNER_TEMP/orbit.koplugin.zip"
          unzip -p "$RUNNER_TEMP/orbit.koplugin.zip" orbit.koplugin/main.lua | grep -qx 'local PATCH_VERSION = "0.0.0-ci"'
          # The shared settings schema rides along (docs/design/companion-settings.md §4.1).
          unzip -p "$RUNNER_TEMP/orbit.koplugin.zip" orbit.koplugin/settings_schema.json | cmp - shared/settings/schema.json
          if unzip -Z1 "$RUNNER_TEMP/orbit.koplugin.zip" | grep -v '^orbit\.koplugin/'; then exit 1; fi

      - name: USB installer checks
        run: |
          set -euo pipefail
          shellcheck -x tools/install-usb.sh tools/test/test-install-usb.sh android/koreader/package.sh tools/upstreams \
            tools/android-test-version.sh tools/sideload-android.sh tools/sideload-xteink.sh tools/test/test-sideload.sh
          bash tools/test/test-install-usb.sh
          bash tools/test/test-sideload.sh

      - name: Companion tests, debug build and lint
        working-directory: android/companion
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
