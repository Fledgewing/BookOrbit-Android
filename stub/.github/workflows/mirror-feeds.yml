name: Mirror BookSync feeds
on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [mirror-feeds]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-feeds
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy public feed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 mirror.py
